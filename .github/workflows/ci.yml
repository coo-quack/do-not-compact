name: CI

on:
  pull_request:
    branches: [main, develop]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate plugin manifest
        run: node -e "const p = require('./.claude-plugin/plugin.json'); if (!p.name) throw new Error('missing name')"

      - name: Validate package.json
        run: node -e "const p = require('./package.json'); if (!p.name || !p.version) throw new Error('missing name or version')"

      # `claude plugin update` reads the version in plugin.json, not package.json.
      # plugin.json stayed at 1.1.0 through 1.1.1-1.1.5, so installed copies never updated.
      - name: package.json and plugin.json declare the same version
        run: |
          pkg=$(node -p "require('./package.json').version")
          plugin=$(node -p "require('./.claude-plugin/plugin.json').version")
          for value in "$pkg" "$plugin"; do
            if ! [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::a manifest declares no usable version — package.json is '$pkg', .claude-plugin/plugin.json is '$plugin'."
              exit 1
            fi
          done
          if [ "$pkg" != "$plugin" ]; then
            echo "::error::version mismatch — package.json is $pkg, .claude-plugin/plugin.json is $plugin. Bump both."
            exit 1
          fi

      - name: Check hook script is executable
        run: test -r hooks/reload-claude-md.sh

      - name: Shellcheck hook script
        run: shellcheck hooks/reload-claude-md.sh || true
